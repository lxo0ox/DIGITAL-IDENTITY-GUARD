<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Digital Identity Guard – an awareness tool that explains the warning signs of fake and impersonating accounts.">
<title>حارس الهوية الرقمية | Digital Identity Guard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="topbar">
    <button type="button" class="lang-btn" id="lang" data-i18n="lang.switch">English</button>
  </div>

  <header class="hero">
    <div class="logo" aria-hidden="true">🛡️</div>
    <h1>DIGITAL IDENTITY GUARD</h1>
    <div class="sub" data-i18n="brand.sub">حارس الهوية الرقمية</div>
    <h2 data-i18n="hero.title">احمِ هويتك الرقمية</h2>
    <p data-i18n="hero.text"></p>
    <button type="button" class="primary" id="start" data-i18n="hero.cta"></button>
  </header>

  <nav aria-label="Main">
    <button type="button" class="active" data-page="home" data-i18n="nav.home"></button>
    <button type="button" data-page="scan" data-i18n="nav.scan"></button>
    <button type="button" data-page="about" data-i18n="nav.about"></button>
    <button type="button" data-page="tips" data-i18n="nav.tips"></button>
  </nav>

  <!-- Home -->
  <section id="home">
    <h2 data-i18n="home.title"></h2>
    <div class="tiles">
      <div class="tile">🔍 <b data-i18n="home.t1"></b><div class="muted" data-i18n="home.t1d"></div></div>
      <div class="tile">🧠 <b data-i18n="home.t2"></b><div class="muted" data-i18n="home.t2d"></div></div>
      <div class="tile">📊 <b data-i18n="home.t3"></b><div class="muted" data-i18n="home.t3d"></div></div>
      <div class="tile">🔐 <b data-i18n="home.t4"></b><div class="muted" data-i18n="home.t4d"></div></div>
    </div>
    <p data-i18n="home.text"></p>
    <p class="privacy" data-i18n="home.privacy"></p>
  </section>

  <!-- Scan -->
  <section id="scan" class="hidden">
    <h2 data-i18n="scan.title"></h2>
    <p class="muted" data-i18n="scan.intro"></p>

    <div class="examples">
      <span class="muted" data-i18n="scan.examples"></span>
      <button type="button" class="chip" data-example="1" data-i18n="ex.1"></button>
      <button type="button" class="chip" data-example="2" data-i18n="ex.2"></button>
      <button type="button" class="chip" data-example="3" data-i18n="ex.3"></button>
    </div>

    <form id="scan-form" novalidate>
      <fieldset>
        <legend data-i18n="scan.step1"></legend>
        <label class="field" for="account" data-i18n="scan.accountLabel"></label>
        <input id="account" class="ltr" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
               data-i18n-ph="scan.accountPh" aria-describedby="account-error">
        <p class="error" id="account-error" role="alert"></p>

        <label class="field" for="claim" data-i18n="scan.claimLabel"></label>
        <input id="claim" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" list="orgs"
               data-i18n-ph="scan.claimPh" aria-describedby="claim-hint">
        <datalist id="orgs"></datalist>
        <p class="muted" id="claim-hint" data-i18n="scan.claimHint"></p>
      </fieldset>

      <fieldset>
        <legend data-i18n="scan.step2"></legend>
        <p class="field-q" id="badge-q" data-i18n="scan.badgeLabel"></p>
        <div class="badges" role="radiogroup" aria-labelledby="badge-q">
          <label class="badge-opt"><input type="radio" name="badge" value="unsure" checked><span data-i18n="badge.unsure"></span></label>
          <label class="badge-opt"><input type="radio" name="badge" value="none"><span data-i18n="badge.none"></span></label>
          <label class="badge-opt"><input type="radio" name="badge" value="blue"><i class="dot dot-blue" aria-hidden="true"></i><span data-i18n="badge.blue"></span></label>
          <label class="badge-opt"><input type="radio" name="badge" value="gold"><i class="dot dot-gold" aria-hidden="true"></i><span data-i18n="badge.gold"></span></label>
          <label class="badge-opt"><input type="radio" name="badge" value="grey"><i class="dot dot-grey" aria-hidden="true"></i><span data-i18n="badge.grey"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="scan.step3"></legend>
        <label class="field" for="messages" data-i18n="scan.messagesLabel"></label>
        <textarea id="messages" rows="5" dir="auto" data-i18n-ph="scan.messagesPh" aria-describedby="messages-hint"></textarea>
        <p class="muted" id="messages-hint" data-i18n="scan.messagesHint"></p>
      </fieldset>

      <fieldset>
        <legend data-i18n="scan.step4"></legend>
        <div id="checks">
          <label class="check"><input type="checkbox" value="new_account"><span><b data-i18n="sign.new_account"></b><div class="muted" data-i18n="sign.new_account.d"></div></span></label>
          <label class="check"><input type="checkbox" value="unusual_activity"><span><b data-i18n="sign.unusual_activity"></b><div class="muted" data-i18n="sign.unusual_activity.d"></div></span></label>
          <label class="check"><input type="checkbox" value="suspicious_username"><span><b data-i18n="sign.suspicious_username"></b><div class="muted" data-i18n="sign.suspicious_username.d"></div></span></label>
          <label class="check"><input type="checkbox" value="suspicious_photo"><span><b data-i18n="sign.suspicious_photo"></b><div class="muted" data-i18n="sign.suspicious_photo.d"></div></span></label>
          <label class="check"><input type="checkbox" value="sensitive_request"><span><b data-i18n="sign.sensitive_request"></b><div class="muted" data-i18n="sign.sensitive_request.d"></div></span></label>
        </div>
      </fieldset>

      <button type="submit" class="primary" id="analyze" data-i18n="scan.analyze"></button>
    </form>

    <div id="report" class="report hidden" tabindex="-1" aria-live="polite">
      <div class="verdict" id="verdict">
        <span class="tag" data-i18n="report.tag"></span>
        <h3 id="v-title"></h3>
        <p id="v-desc"></p>
        <div id="v-notes"></div>
        <div class="advice"><b data-i18n="v.whatToDo"></b><p id="v-action"></p></div>
      </div>

      <div class="rsec">
        <h3 data-i18n="report.detected"></h3>
        <dl class="detected" id="detected"></dl>
      </div>
      <div class="rsec"><h3 data-i18n="sec.identity"></h3><div id="r-identity"></div></div>
      <div class="rsec" id="r-badge-sec"><h3 data-i18n="sec.badge"></h3><div id="r-badge"></div></div>
      <div class="rsec"><h3 data-i18n="sec.messages"></h3><ul class="factors" id="r-messages"></ul></div>
      <div class="rsec"><h3 data-i18n="sec.signals"></h3><ul class="factors" id="r-signals"></ul></div>
      <div class="rsec" id="checks-block"><h3 data-i18n="report.checks"></h3><ul class="checks" id="auto-checks"></ul></div>

      <div class="report-actions"><button type="button" id="reset" data-i18n="report.reset"></button></div>
    </div>

    <p class="muted" data-i18n="scan.disclaimer"></p>
  </section>

  <!-- About -->
  <section id="about" class="hidden">
    <h2 data-i18n="about.title"></h2>
    <div class="stack">
      <div class="tile"><b data-i18n="about.intro"></b><p data-i18n="about.introText"></p></div>
      <div class="tile"><b data-i18n="about.method"></b>
        <ol>
          <li data-i18n="about.m1"></li>
          <li data-i18n="about.m2"></li>
          <li data-i18n="about.m3"></li>
          <li data-i18n="about.m4"></li>
          <li data-i18n="about.m5"></li>
        </ol>
      </div>
      <div class="tile"><b data-i18n="about.innov"></b><p data-i18n="about.innovText"></p></div>
      <div class="tile"><b data-i18n="about.results"></b><p data-i18n="about.resultsText"></p></div>
      <div class="tile"><b data-i18n="about.future"></b><p data-i18n="about.futureText"></p></div>
    </div>
  </section>

  <!-- Tips -->
  <section id="tips" class="hidden">
    <h2 data-i18n="tips.title"></h2>
    <div class="tiles">
      <div class="tile"><b data-i18n="tips.1"></b><p class="muted" data-i18n="tips.1d"></p></div>
      <div class="tile"><b data-i18n="tips.2"></b><p class="muted" data-i18n="tips.2d"></p></div>
      <div class="tile"><b data-i18n="tips.3"></b><p class="muted" data-i18n="tips.3d"></p></div>
      <div class="tile"><b data-i18n="tips.4"></b><p class="muted" data-i18n="tips.4d"></p></div>
      <div class="tile"><b data-i18n="tips.5"></b><p class="muted" data-i18n="tips.5d"></p></div>
      <div class="tile"><b data-i18n="tips.6"></b><p class="muted" data-i18n="tips.6d"></p></div>
    </div>
  </section>

  <footer>
    🛡️ DIGITAL IDENTITY GUARD<br>
    Yazan Omar Alzahrani · Mohannad Ali Alghamdi<br>
    <span data-i18n="footer.project"></span>
  </footer>
</main>

<script src="js/analyzer.js"></script>
<script src="js/messages.js"></script>
<script src="js/official-accounts.js"></script>
<script src="js/guard.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
